name: release

on:
  push:
    branches: ["multiversion"]
    paths:
      - "gradle.properties"

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    name: Check for a version bump
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_new: ${{ steps.check.outputs.is_new }}

    steps:
      - name: checkout repository
        uses: actions/checkout@v7.0.1

      - name: read mod version
        id: version
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: check for existing tag
        id: check
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build and publish release
    needs: check-version
    if: needs.check-version.outputs.is_new == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: checkout repository
        uses: actions/checkout@v7.0.1

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6.4.0

      - name: setup jdk
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '25'
          distribution: 'microsoft'
          verify-signature: true

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build --build-cache

      - name: create release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: XenAddons v${{ needs.check-version.outputs.version }}
          body_path: releases/github-v${{ needs.check-version.outputs.version }}.md
          files: versions/*/build/libs/xenaddons-*.jar
          fail_on_unmatched_files: true
