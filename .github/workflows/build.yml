name: build

on:
  pull_request:
    paths: &build-paths
      - ".gitattributes"
      - ".github/workflows/build.yml"
      - "gradle/**"
      - "src/**"
      - "versions/**"
      - "build.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "LICENSE"
      - "settings.gradle.kts"
      - "stonecutter.gradle.kts"
  push:
    branches: ["26.1.2"]
    paths: *build-paths

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: checkout repository
        uses: actions/checkout@v7.0.1

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6.4.0

      - name: setup jdk
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '25'
          distribution: 'microsoft'
          verify-signature: true

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build --build-cache

      - name: upload jar 26.1.2
        uses: actions/upload-artifact@v7.0.1
        with:
          path: versions/26.1.2/build/libs/xenaddons-*.jar
          if-no-files-found: error
          archive: false

      - name: upload jar 26.2
        uses: actions/upload-artifact@v7.0.1
        with:
          path: versions/26.2/build/libs/xenaddons-*.jar
          if-no-files-found: error
          archive: false

      - name: upload jar 26.3
        uses: actions/upload-artifact@v7.0.1
        with:
          path: versions/26.3/build/libs/xenaddons-*.jar
          if-no-files-found: error
          archive: false
